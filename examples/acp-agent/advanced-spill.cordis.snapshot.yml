# Keyless replay counterpart to advanced-spill.cordis.yml.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./advanced.cordis.snapshot.yml
    patches:
      - insert:
          - id: spill-local
            name: '@deepseek-ai/dsh-spill-local'
            config:
              root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT ?? './.spill'
          - id: spill-policy
            name: '@deepseek-ai/dsh-spill-policy'
            config:
              maxInlineBytes: 800
